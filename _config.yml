title: John Beckford
logo: "/images/1726765151942.jpg?raw=true"
description: >
  Quantitative Risk Analyst | Algorithm Development | Data Science
  <br>
  Building data-driven solutions for capital markets efficiency
theme: jekyll-theme-cayman  # More modern than minimal
plugins:
  - jekyll-seo-tag  # For better SEO
  - jekyll-sitemap  # For site navigation

# Full-width layout settings
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Custom CSS (create file at /assets/css/style.scss)
stylesheets:
  - /assets/css/style.scss

# Modern meta tags
seo:
  name: John Beckford
  links:
    - "https://www.linkedin.com/in/john-beckford"
    - "https://github.com/jbeckford-data"

google_analytics: G-82MHSZEQG3
